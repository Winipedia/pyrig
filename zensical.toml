[project]
site_name = "pyrig"
site_description = "A tool that standardizes and automates Python project setup, configuration, development, and maintenance."
site_url = "https://Winipedia.github.io/pyrig"
repo_url = "https://github.com/Winipedia/pyrig"
edit_uri = "edit/main/docs"

[project.validation]
shadowed_definitions = true
shadowed_footnotes = true
unresolved_footnotes = true
unresolved_references = true
unused_definitions = true
unused_footnotes = true

[project.theme]
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.preview",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"

[project.theme.palette.toggle]
icon = "lucide/sun"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"

[project.theme.palette.toggle]
icon = "lucide/moon"
name = "Switch to light mode"

[project.plugins.mkdocstrings.handlers.python]
paths = [
  "src",
]
inventories = [
  "https://docs.python.org/3/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
backlinks = "tree"
docstring_section_style = "list"
inherited_members = true
members = true
merge_init_into_class = true
parameter_headings = true
relative_crossrefs = true
scoped_crossrefs = true
separate_signature = true
show_root_heading = true
show_signature_annotations = true
show_signature_type_parameters = true
show_submodules = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
type_parameter_headings = true
filters = []

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true
