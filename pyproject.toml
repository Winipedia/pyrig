[project]
name = "pyrig"
version = "18.103.20"
description = "A Python project setup and management tool built on infrastructure as code and convention over configuration."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = [
  "LICENSE",
]
authors = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
maintainers = [
  { name = "Winipedia", email = "winipedia@gmx.de" },
]
keywords = [
  "automation",
  "boilerplate",
  "ci-cd",
  "code-generation",
  "code-quality",
  "configuration",
  "convention-over-configuration",
  "developer-tools",
  "devops",
  "github-actions",
  "infrastructure-as-code",
  "project-generator",
  "project-maintenance",
  "project-scaffolding",
  "project-setup",
  "python-project",
  "test-generation",
  "test-scaffolding",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Installation/Setup",
  "Topic :: System :: Software Distribution",
  "Typing :: Typed",
]
dependencies = [
  "inquirerpy>=0.3.4",
  "packaging>=26.3",
  "pyrig-runtime>=3.23.45",
  "ruamel-yaml>=0.19.1",
  "ruamel-yaml-clib>=0.2.15",
  "spdx-matcher>=0.1.4",
  "tomli-w>=1.2.0",
  "typer>=0.27.2",
]

[project.urls]
Changelog = "https://github.com/Winipedia/pyrig/releases"
Documentation = "https://Winipedia.github.io/pyrig"
Homepage = "https://github.com/Winipedia/pyrig"
Issues = "https://github.com/Winipedia/pyrig/issues"
Source = "https://github.com/Winipedia/pyrig"

[project.scripts]
pyrig = "pyrig_runtime.rig.cli.main:main"

[dependency-groups]
dev = [
  "actionlint-py>=1.7.12.25",
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "detect-secrets>=1.5.0",
  "mkdocstrings[python]>=1.0.6",
  "pre-commit-hooks>=6.0.0",
  "prek>=0.5.3",
  "pyflakes>=3.4.0",
  "pyrig-badge>=0.1.0",
  "pyrig-env>=1.0.29",
  "pyrig-fixtures>=2.25.3",
  "pyrig-opensource>=1.0.0",
  "pyrig-overrides>=4.20.58",
  "pyrig-pypi>=3.20.28",
  "pyrig-resources>=3.13.74",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=5.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.16.8",
  "rumdl>=0.2.75",
  "ryl>=0.22.0",
  "shellcheck-py>=0.11.0.1",
  "shfmt-py>=4.2.0",
  "tombi>=1.5.5",
  "ty>=0.0.83",
  "typos>=1.50.2",
  "vulture>=2.16",
  "zensical>=0.0.64",
  "zizmor>=1.30.1",
]

[build-system]
requires = [
  "uv-build",
]
build-backend = "uv_build"

[tool.deptry]
root = "src"

[tool.deptry.per_rule_ignores]
DEP002 = [
  "pyrig-runtime",
]

[tool.pytest]
addopts = [
  "--cov-branch",
  "--cov-fail-under=100",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=xml",
  "--cov=pyrig",
  "--dist=worksteal",
  "--numprocesses=auto",
  "--report-chars=a",
]
filterwarnings = [
  "error",
]
strict = true
testpaths = [
  "tests",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
ignore = [
  "CPY001",
]
select = [
  "ALL",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ryl.rules]
ALL = "enable"
key-ordering = "disable"

[tool.vulture]
paths = [
  "src",
  "vulture_whitelist.py",
]
