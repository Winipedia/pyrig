---
"name": "Security Practices"
"on":
  "workflow_call": {}
"permissions": {}
"concurrency":
  "group": "Security Practices-${{ github.workflow }}-${{ github.ref }}"
  "cancel-in-progress": true
"run-name": "Security Practices"
"jobs":
  "analyze":
    "name": "Analyze"
    "permissions":
      "actions": "read"  # required
      "contents": "read"
      "id-token": "write"  # required
      "security-events": "write"  # required
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 30
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Analyze Scorecard"
        "id": "analyze-scorecard"
        # ryl disable-line rule:line-length
        "uses": "ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e"  # v2.5.0
        "with":
          "results_file": "scorecard.sarif"
          "results_format": "sarif"
          "publish_results": true
      -
        "name": "Upload Sarif"
        "id": "upload-sarif"
        # ryl disable-line rule:line-length
        "uses": "github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370"  # v4.39.1
        "with":
          "sarif_file": "scorecard.sarif"
  "check-alerts":
    "name": "Check Alerts"
    "permissions":
      "security-events": "read"  # required
    "needs":
      - "analyze"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 5
    "steps":
      -
        "name": "Check Alerts"
        "id": "check-alerts"
        "run": |-
          gh \
            api \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            --method=GET \
            --raw-field="ref=${GITHUB_REF}" \
            --raw-field=state=open \
            --raw-field=tool_name=Scorecard \
            --jq='if . != [] then error("Alerts found") end'
        "env":
          "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
...
