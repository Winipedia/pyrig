---
"name": "Deploy"
"on":
  "workflow_call":
    "secrets":
      "REPO_TOKEN":
        "required": true
"permissions": {}
"concurrency":
  "group": "Deploy-${{ github.ref }}"
  "cancel-in-progress": false
"defaults":
  "run":
    "shell": "bash"
"run-name": "Deploy"
"jobs":
  "repository":
    "name": "Repository"
    "permissions":
      "contents": "read"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 10
    "environment": "repository"
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Configure Repository"
        "id": "configure-repository"
        "run": "bash .github/configure.sh"
        "env":
          "GH_TOKEN": "${{ secrets.REPO_TOKEN }}"
  "build-documentation":
    "name": "Build Documentation"
    "permissions":
      "contents": "read"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 60
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        # ryl disable-line rule:line-length
        "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2"  # v10.3.3
        "with":
          "python-version": "3.15"
      -
        "name": "Install Dependencies"
        "id": "install-dependencies"
        "run": "uv sync"
      -
        "name": "Build Documentation"
        "id": "build-documentation"
        "run": "uv run zensical build"
      -
        "name": "Upload Documentation"
        "id": "upload-documentation"
        # ryl disable-line rule:line-length
        "uses": "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9"  # v5.0.0
        "with":
          "path": "site"
  "deploy-documentation":
    "name": "Deploy Documentation"
    "permissions":
      "id-token": "write"  # required
      "pages": "write"  # required
    "needs":
      - "build-documentation"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 30
    "environment": "documentation"
    "steps":
      -
        "name": "Configure Pages"
        "id": "configure-pages"
        # ryl disable-line rule:line-length
        "uses": "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d"  # v6.0.0
        "with":
          "enablement": "true"
          "token": "${{ secrets.REPO_TOKEN }}"
      -
        "name": "Deploy Documentation"
        "id": "deploy-documentation"
        # ryl disable-line rule:line-length
        "uses": "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346"  # v5.0.1
  "build-package":
    "name": "Build Package"
    "permissions":
      "contents": "read"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 60
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        # ryl disable-line rule:line-length
        "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2"  # v10.3.3
        "with":
          "python-version": "3.15"
      -
        "name": "Build Package"
        "id": "build-package"
        "run": "uv build"
      -
        "name": "Upload Package Distributions"
        "id": "upload-package-distributions"
        # ryl disable-line rule:line-length
        "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9"  # v7.0.2
        "with":
          "name": "package-distributions"
          "path": "dist"
          "if-no-files-found": "error"
  "publish-package":
    "name": "Publish Package"
    "permissions":
      "id-token": "write"  # required
    "needs":
      - "build-package"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 30
    "environment": "package"
    "steps":
      -
        "name": "Setup Package Manager"
        "id": "setup-package-manager"
        # ryl disable-line rule:line-length
        "uses": "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2"  # v10.3.3
        "with":
          "python-version": "3.15"
          "enable-cache": "false"
      -
        "name": "Download Package Distributions"
        "id": "download-package-distributions"
        # ryl disable-line rule:line-length
        "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333"  # v8.0.2
        "with":
          "name": "package-distributions"
          "path": "dist"
      -
        "name": "Publish Package"
        "id": "publish-package"
        "run": "uv publish --trusted-publishing=always"
...
