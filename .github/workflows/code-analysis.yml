---
"name": "Code Analysis"
"on":
  "workflow_call": {}
"permissions": {}
"concurrency":
  "group": "Code Analysis-${{ github.ref }}"
  "cancel-in-progress": true
"run-name": "Code Analysis"
"jobs":
  "analyze":
    "name": "Analyze"
    "permissions":
      "actions": "read"  # required
      "contents": "read"
      "security-events": "write"  # required
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 90
    "strategy":
      "matrix":
        "language":
          - "python"
          - "actions"
      "fail-fast": true
    "steps":
      -
        "name": "Checkout Repository"
        "id": "checkout-repository"
        # ryl disable-line rule:line-length
        "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        "with":
          "persist-credentials": false
      -
        "name": "Initialize Codeql"
        "id": "initialize-codeql"
        # ryl disable-line rule:line-length
        "uses": "github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370"  # v4.39.1
        "with":
          "languages": "${{ matrix.language }}"
          "config-file": ".github/codeql.yml"
      -
        "name": "Analyze Code"
        "id": "analyze-code"
        # ryl disable-line rule:line-length
        "uses": "github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370"  # v4.39.1
  "check-alerts":
    "name": "Check Alerts"
    "permissions":
      "security-events": "read"  # required
    "needs":
      - "analyze"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 5
    "steps":
      -
        "name": "Check Alerts"
        "id": "check-alerts"
        "run": |-
          gh \
            api \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts" \
            --method=GET \
            --raw-field="ref=${GITHUB_REF}" \
            --raw-field=state=open \
            --raw-field=tool_name=CodeQL \
            --jq='if . != [] then error("Alerts found") end'
        "env":
          "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
...
